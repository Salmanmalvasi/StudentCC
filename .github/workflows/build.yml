name: Build Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Extract version info
      run: |
        VERSION_CODE=$(grep 'versionCode' app/build.gradle | head -1 | awk '{print $2}')
        VERSION_NAME=$(grep 'versionName' app/build.gradle | head -1 | awk '{print $2}' | tr -d '"')
        echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

    - name: Create google-services.json
      env:
        FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
        FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      run: |
        chmod +x ./generate-config.sh
        ./generate-config.sh

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Prepare release assets
      run: |
        APK_PATH=$(ls app/build/outputs/apk/release/*.apk | head -1)
        cp "$APK_PATH" "app/build/outputs/apk/release/StudentCC.apk"
        cat > about.json <<EOF
{
  "versionCode": ${VERSION_CODE},
  "versionName": "${VERSION_NAME}",
  "tagName": "v${VERSION_NAME}",
  "releaseNotes": "StudentCC v${VERSION_NAME} — see GitHub release notes for details.",
  "downloadUrl": "https://github.com/Salmanmalvasi/StudentCC/releases/latest/download/StudentCC.apk",
  "authorisedUserAgent": "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36"
}
EOF

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StudentCC-Release-APK
        path: |
          app/build/outputs/apk/release/StudentCC.apk
          about.json

    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION_NAME }}
        name: StudentCC v${{ env.VERSION_NAME }}
        files: |
          app/build/outputs/apk/release/StudentCC.apk
          about.json
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
